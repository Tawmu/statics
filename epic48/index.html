<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPIC48 by the numbers</title>
<style>
  :root {
    --bg: #0d0e10; --panel: #17181c; --panel-2: #1d1f24;
    --ink: #ffffff; --ink-2: #c9cdd3; --ink-3: #82878f;
    --orange: #F47B20; --grey: #c9cdd3;
    --grid: rgba(201, 205, 211, 0.08); --grid-day: rgba(201, 205, 211, 0.18);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, "Segoe UI", sans-serif;
    padding: 28px clamp(16px, 4vw, 48px) 40px;
  }
  header { display: flex; align-items: center; gap: 18px; margin-bottom: 6px; flex-wrap: wrap; }
  header img { height: 44px; }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: 0.2px; }
  .sub { color: var(--ink-3); font-size: 14px; margin-bottom: 22px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--panel); border: 1px solid rgba(201,205,211,.07); border-radius: 10px; padding: 14px 16px 12px; }
  .tile .k { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
  .tile .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .tile .v small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
  .tile .n { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .card { background: var(--panel); border: 1px solid rgba(201,205,211,.07); border-radius: 12px; padding: 18px 18px 14px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card h2 span { color: var(--ink-3); font-weight: 400; }
  .wrap { position: relative; }
  svg { display: block; width: 100%; height: auto; }
  .tip {
    position: absolute; pointer-events: none; display: none;
    background: var(--panel-2); border: 1px solid rgba(201,205,211,.15);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; white-space: nowrap;
    box-shadow: 0 4px 18px rgba(0,0,0,.5); z-index: 2; font-variant-numeric: tabular-nums;
  }
  .tip .t { color: var(--ink-3); font-size: 12px; }
  /* heatmap */
  .hm { display: grid; grid-template-columns: 64px repeat(24, 1fr); gap: 3px; margin-top: 10px; }
  .hm .rl { font-size: 12px; color: var(--ink-2); align-self: center; }
  .hm .cl { font-size: 11px; color: var(--ink-3); text-align: center; }
  .hm .cell { aspect-ratio: 1.6; border-radius: 3px; background: rgba(201,205,211,.04); }
  .hmfoot { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--ink-3); }
  .hmbar { width: 140px; height: 8px; border-radius: 4px;
    background: linear-gradient(to right, rgba(244,123,32,.06), rgba(244,123,32,1)); }
  .legend { display: flex; justify-content: flex-start; gap: 26px; font-size: 13px; color: var(--ink-2); margin-top: 8px; padding-left: 52px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
</style></head>

    if (h === 0 && hp === 23) {
      g += '<line x1="' + X(i) + '" y1="' + MT + '" x2="' + X(i) + '" y2="' + (MT + IH) + '" stroke="var(--grid-day)"/>';
      g += '<text x="' + (X(i) + 6) + '" y="' + (H - 22) + '" fill="var(--ink-2)" font-size="12.5">' + fmtDT(ts(i), { weekday: 'short', day: 'numeric', month: 'short' }) + '</text>';
    }
  }
  g += '<text x="' + ML + '" y="' + (H - 22) + '" fill="var(--ink-2)" font-size="12.5">' + fmtDT(ts(0), { weekday: 'short', day: 'numeric', month: 'short' }) + '</text>';
  let path = '', area = '', pen = false, runStart = null;
  for (let i = 0; i < n; i++) {
    const v = series[i];
    if (v == null) { if (pen) area += 'L' + X(i - 1).toFixed(1) + ' ' + (MT + IH) + 'Z'; pen = false; continue; }
    path += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1);
    area += (pen ? 'L' : 'M' + X(i).toFixed(1) + ' ' + (MT + IH) + 'L') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1);
    pen = true;
  }
  if (pen) area += 'L' + X(n - 1).toFixed(1) + ' ' + (MT + IH) + 'Z';
  let ann = '';
  if (annotate) {
    const pi = series.indexOf(maxOf(series));
    const ax = Math.min(Math.max(X(pi), ML + 55), W - MR - 130);
    ann = '<circle cx="' + X(pi) + '" cy="' + Y(series[pi]) + '" r="4.5" fill="' + color + '" stroke="var(--bg)" stroke-width="2"/>' +
      '<text x="' + ax + '" y="' + (Y(series[pi]) - 10) + '" text-anchor="middle" fill="' + color + '" font-size="13" font-weight="650" ' +
      'paint-order="stroke" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round">' + annotate(series[pi], ts(pi)) + '</text>';
  }
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.innerHTML = defs + g +
    '<path d="' + area + '" fill="url(#g' + el.id + ')"/>' +
    '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round"/>' + ann +
    '<line class="xh" x1="0" y1="' + MT + '" x2="0" y2="' + (MT + IH) + '" stroke="rgba(255,255,255,.35)" visibility="hidden"/>' +
    '<circle class="dot" r="4" fill="' + color + '" stroke="var(--bg)" stroke-width="2" visibility="hidden"/>';
  const tip = document.createElement('div'); tip.className = 'tip';
  el.appendChild(svg); el.appendChild(tip);
  const xh = svg.querySelector('.xh'), dot = svg.querySelector('.dot');
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect();
    const i = Math.round(((e.clientX - r.left) / r.width * W - ML) / IW * (n - 1));
    if (i < 0 || i >= n || series[i] == null) return;
    const x = X(i);
    xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x); dot.setAttribute('cy', Y(series[i])); dot.setAttribute('visibility', 'visible');
    tip.innerHTML = '<div class="t">' + fmtDT(ts(i), { weekday: 'short', hour: '2-digit', minute: '2-digit' }) + '</div><b>' + tipFmt(series[i]) + '</b>';
    tip.style.display = 'block';
    const wr = el.getBoundingClientRect(), sx = x / W * r.width;
    tip.style.left = Math.min(sx + 14, wr.width - tip.offsetWidth - 6) + 'px';
    tip.style.top = Math.max(e.clientY - wr.top - tip.offsetHeight - 14, 4) + 'px';
  });
  svg.addEventListener('pointerleave', () => {
    tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden');
  });
}

// ---- WAN throughput: smooth 5-min averages + translucent peak-burst envelope ----
(function wanChart() {
  const A = DATA.rxMbit, B = DATA.txMbit, E = DATA.rxPk, F = DATA.txPk;
  const n = Math.min(A.length, B.length, E.length, F.length);
  const W = 1280, H = 420, ML = 52, MR = 20, MT = 16, MB = 42;
  const IW = W - ML - MR, IH = H - MT - MB;
  const yMaxG = Math.ceil(DATA.peakRxGbit);
  const X = i => ML + (i / (n - 1)) * IW;
  const Y = v => MT + IH - (v / (yMaxG * 1000)) * IH;
  const base = (MT + IH).toFixed(1);
  const pathN = a => {
    let d = '', pen = false;
    for (let i = 0; i < n; i++) {
      if (a[i] == null) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(a[i]).toFixed(1);
      pen = true;
    }
    return d;
  };
  const runsOf = a => {
    const runs = []; let run = [];
    for (let i = 0; i < n; i++) {
      if (a[i] == null) { if (run.length > 1) runs.push(run); run = []; }
      else run.push(i);
    }
    if (run.length > 1) runs.push(run);
    return runs;
  };
  const areaN = a => runsOf(a).map(run =>
    'M' + X(run[0]).toFixed(1) + ' ' + base +
    run.map(i => 'L' + X(i).toFixed(1) + ' ' + Y(a[i]).toFixed(1)).join('') +
    'L' + X(run[run.length - 1]).toFixed(1) + ' ' + base + 'Z').join('');
  const bandN = (top, bottom) => runsOf(top).map(run =>
    run.map((i, k) => (k ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(top[i]).toFixed(1)).join('') +
    run.slice().reverse().map(i => 'L' + X(i).toFixed(1) + ' ' + Y(bottom[i] || 0).toFixed(1)).join('') + 'Z').join('');

  let g = '';
  for (let t = 0; t <= yMaxG; t++) {
    g += '<line x1="' + ML + '" y1="' + Y(t * 1000) + '" x2="' + (W - MR) + '" y2="' + Y(t * 1000) + '" stroke="var(--grid)"/>';
    g += '<text x="' + (ML - 10) + '" y="' + (Y(t * 1000) + 4) + '" text-anchor="end" fill="var(--ink-3)" font-size="12">' + (t === yMaxG ? t + ' Gbit/s' : t) + '</text>';
  }
  for (let i = 1; i < n; i++) {
    const h = +fmtDT(ts(i), { hour: '2-digit', hour12: false }), hp = +fmtDT(ts(i - 1), { hour: '2-digit', hour12: false });
    if (h === 0 && hp === 23) {
      g += '<line x1="' + X(i) + '" y1="' + MT + '" x2="' + X(i) + '" y2="' + (MT + IH) + '" stroke="var(--grid-day)"/>';
      g += '<text x="' + (X(i) + 6) + '" y="' + (H - 22) + '" fill="var(--ink-2)" font-size="12.5">' + fmtDT(ts(i), { weekday: 'short', day: 'numeric', month: 'short' }) + '</text>';
    }
  }
  g += '<text x="' + ML + '" y="' + (H - 22) + '" fill="var(--ink-2)" font-size="12.5">' + fmtDT(ts(0), { weekday: 'short', day: 'numeric', month: 'short' }) + '</text>';

  const pkI = E.indexOf(maxOf(E));
  const pkLbl = fmtRate(maxOf(E)) + ' \u00b7 ' + fmtDT(DATA.peakRxAt * 1000, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  const ann = '<circle cx="' + X(pkI) + '" cy="' + Y(E[pkI]) + '" r="4.5" fill="var(--orange)" stroke="var(--bg)" stroke-width="2"/>' +
    '<text x="' + Math.min(Math.max(X(pkI) + 10, ML + 60), W - MR - 150) + '" y="' + (Y(E[pkI]) + 4) + '" fill="var(--orange)" font-size="13" font-weight="650" ' +
    'paint-order="stroke" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round">' + pkLbl + '</text>';

  const el = document.getElementById('wanChart');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.innerHTML = '<defs>' +
    '<linearGradient id="gWrx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F47B20" stop-opacity="0.28"/><stop offset="1" stop-color="#F47B20" stop-opacity="0.02"/></linearGradient>' +
    '<linearGradient id="gWtx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9cdd3" stop-opacity="0.22"/><stop offset="1" stop-color="#c9cdd3" stop-opacity="0.02"/></linearGradient></defs>' +
    g +
    '<path d="' + areaN(A) + '" fill="url(#gWrx)"/>' +
    '<path d="' + areaN(B) + '" fill="url(#gWtx)"/>' +
    '<path d="' + bandN(F, B) + '" fill="rgba(201,205,211,.10)"/>' +
    '<path d="' + bandN(E, A) + '" fill="rgba(244,123,32,.14)"/>' +
    '<path d="' + pathN(F) + '" fill="none" stroke="rgba(201,205,211,.35)" stroke-width="1" stroke-linejoin="round"/>' +
    '<path d="' + pathN(E) + '" fill="none" stroke="rgba(244,123,32,.45)" stroke-width="1" stroke-linejoin="round"/>' +
    '<path d="' + pathN(B) + '" fill="none" stroke="var(--grey)" stroke-width="1.8" stroke-linejoin="round"/>' +
    '<path d="' + pathN(A) + '" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linejoin="round"/>' +
    ann +
    '<line class="xh" x1="0" y1="' + MT + '" x2="0" y2="' + (MT + IH) + '" stroke="rgba(255,255,255,.35)" visibility="hidden"/>' +
    '<circle class="dA" r="4" fill="var(--orange)" stroke="var(--bg)" stroke-width="2" visibility="hidden"/>' +
    '<circle class="dB" r="4" fill="var(--grey)" stroke="var(--bg)" stroke-width="2" visibility="hidden"/>';
  const tip = document.createElement('div'); tip.className = 'tip';
  el.appendChild(svg); el.appendChild(tip);
  const xh = svg.querySelector('.xh'), dA = svg.querySelector('.dA'), dB = svg.querySelector('.dB');
  const fmtOr = v => v == null ? '\u2014' : fmtRate(v);
  const row = (c, l, v, muted) => '<div style="display:flex;align-items:center;gap:7px;' + (muted ? 'color:var(--ink-3);font-size:12px' : '') + '">' +
    '<i style="width:10px;height:3px;border-radius:2px;background:' + c + '"></i>' + l +
    '<b style="margin-left:auto;padding-left:14px">' + v + '</b></div>';
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect();
    const i = Math.round(((e.clientX - r.left) / r.width * W - ML) / IW * (n - 1));
    if (i < 0 || i >= n) return;
    const x = X(i);
    xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
    dA.setAttribute('cx', x); dA.setAttribute('cy', Y(A[i] || 0)); dA.setAttribute('visibility', A[i] == null ? 'hidden' : 'visible');
    dB.setAttribute('cx', x); dB.setAttribute('cy', Y(B[i] || 0)); dB.setAttribute('visibility', B[i] == null ? 'hidden' : 'visible');
    tip.innerHTML = '<div class="t">' + fmtDT(ts(i), { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</div>' +
      row('var(--orange)', 'Download', fmtOr(A[i])) +
      row('rgba(244,123,32,.4)', 'peak', fmtOr(E[i]), true) +
      row('var(--grey)', 'Upload', fmtOr(B[i])) +
      row('rgba(201,205,211,.35)', 'peak', fmtOr(F[i]), true);
    tip.style.display = 'block';
    const wr = el.getBoundingClientRect(), sx = x / W * r.width;
    tip.style.left = Math.min(sx + 14, wr.width - tip.offsetWidth - 6) + 'px';
    tip.style.top = Math.max(e.clientY - wr.top - tip.offsetHeight - 14, 4) + 'px';
  });
  svg.addEventListener('pointerleave', () => {
    tip.style.display = 'none';
    [xh, dA, dB].forEach(x => x.setAttribute('visibility', 'hidden'));
  });
})();

const devTop = Math.ceil(peakDev / 100) * 100;
chart(document.getElementById('devChart'), DATA.devices, {
  color: 'var(--orange)', gradFrom: '#F47B20',
  yTicks: Array.from({ length: devTop / 100 + 1 }, (_, i) => i * 100),
  yFmt: t => t, tipFmt: v => v + ' devices',
  annotate: (v, t) => v + ' \u00b7 ' + fmtDT(t, { weekday: 'short', hour: '2-digit', minute: '2-digit' }),
});
const qTop = Math.ceil(peakQps / 25) * 25;
chart(document.getElementById('dnsChart'), DATA.qps, {
  color: 'var(--grey)', gradFrom: '#c9cdd3',
  yTicks: Array.from({ length: qTop / 25 + 1 }, (_, i) => i * 25),
  yFmt: t => t, tipFmt: v => v.toFixed(0) + ' queries/s',
  annotate: (v, t) => Math.round(v) + ' q/s \u00b7 ' + fmtDT(t, { weekday: 'short', hour: '2-digit', minute: '2-digit' }),
});

// ---- heatmap: day rows x hour columns, avg download ----
const cells = new Map(); // 'day|hour' -> {sum, n, label}
for (let i = 0; i < DATA.rxMbit.length; i++) {
  if (DATA.rxMbit[i] == null) continue;
  const d = fmtDT(ts(i), { weekday: 'short', day: 'numeric' });
  const h = +fmtDT(ts(i), { hour: '2-digit', hour12: false });
  const k = d + '|' + h;
  const c = cells.get(k) || { sum: 0, n: 0 };
  c.sum += DATA.rxMbit[i]; c.n++;
  cells.set(k, c);
}
const days = [...new Set([...cells.keys()].map(k => k.split('|')[0]))];
const hmMax = Math.max(...[...cells.values()].map(c => c.sum / c.n));
let hm = '<div class="hm"><div></div>' +
  Array.from({ length: 24 }, (_, h) => '<div class="cl">' + (h % 3 === 0 ? h : '') + '</div>').join('');
for (const d of days) {
  hm += '<div class="rl">' + d + '</div>';
  for (let h = 0; h < 24; h++) {
    const c = cells.get(d + '|' + h);
    if (!c) { hm += '<div class="cell"></div>'; continue; }
    const v = c.sum / c.n;
    const a = 0.06 + 0.94 * Math.pow(v / hmMax, 0.6);
    hm += '<div class="cell" style="background:rgba(244,123,32,' + a.toFixed(3) + ')" title="' +
      d + ', ' + String(h).padStart(2, '0') + ':00\u2013' + String(h).padStart(2, '0') + ':59 \u00b7 avg ' + fmtRate(v) + '"></div>';
  }
}
hm += '</div>';
document.getElementById('heatmap').innerHTML = hm;
document.getElementById('hmMax').textContent = fmtRate(hmMax) + ' avg';
</script>
